interface:
  display_name: "需求转测试用例"
  short_description: "根据需求文档、原型图和功能测试点，直接生成符合测试用例模版字段结构的测试用例。"
  default_prompt: "根据下面的需求文档、原型图说明和功能测试点，按本地“测试用例模版”字段结构生成测试用例。若输出为 Markdown 工作稿，默认字段为：用例编码、用例名称、所属模块、标签、前置条件、步骤描述、预期结果、编辑模式、备注、用例状态、责任人、用例等级，其中用例名称仅保留业务标题，不把 TC-001 写进名称；若输出为 MeterSphere 导入版，则移除用例编码列，仅保留模板字段。若单条用例包含多步，请按模板拆成多行，仅首行填写共享字段。"
