<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Probe</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      background: #000;
    }

    #hud {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" controls muted playsinline></video>
    <div id="hud">loading...</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get("src");
    const time = Number(params.get("t") || "0");
    const hud = document.getElementById("hud");
    const video = document.getElementById("video");

    if (!src) {
      hud.textContent = "missing src";
      throw new Error("Missing src parameter");
    }

    video.src = src;

    function render(status) {
      const duration = Number.isFinite(video.duration) ? video.duration.toFixed(2) : "n/a";
      const current = Number.isFinite(video.currentTime) ? video.currentTime.toFixed(2) : "n/a";
      hud.textContent =
        `status: ${status}\n` +
        `time: ${current}s / ${duration}s\n` +
        `video: ${video.videoWidth}x${video.videoHeight}`;
    }

    video.addEventListener("loadedmetadata", () => {
      render("metadata");
      const target = Math.min(Math.max(time, 0), video.duration || time);
      video.currentTime = target;
    });

    video.addEventListener("seeked", () => {
      video.pause();
      render("seeked");
      document.body.dataset.ready = "1";
    });

    video.addEventListener("error", () => {
      const message = video.error ? `${video.error.code}` : "unknown";
      hud.textContent = `video error: ${message}`;
      document.body.dataset.ready = "error";
    });
  </script>
</body>
</html>
